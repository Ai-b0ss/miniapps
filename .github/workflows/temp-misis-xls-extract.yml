name: TEMP MISIS XLS extract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Verify all BBI-26 Saturday cells
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q requests xlrd
          python - <<'PY'
          import re
          import requests
          import xlrd

          url='https://misis.ru/files/-/a20e90e9422cb6229fc49ee8005324ac/itkn-250826.xls'
          r=requests.get(url, timeout=45, headers={'User-Agent':'Mozilla/5.0'})
          print('HTTP', r.status_code, 'BYTES', len(r.content), 'TYPE', r.headers.get('content-type'))
          r.raise_for_status()
          wb=xlrd.open_workbook(file_contents=r.content)
          sh=wb.sheet_by_name('1 курс')

          headers=[]
          for c in range(sh.ncols):
              s=str(sh.cell_value(0,c)).strip()
              if s.startswith('ББИ-26'):
                  headers.append((c,s))
          print('TARGET_GROUPS', headers)
          if len(headers) != 7:
              raise RuntimeError(f'Expected 7 ББИ-26 groups, got {len(headers)}')

          # Each ББИ group occupies four columns: subgroup 1 subject/room + subgroup 2 subject/room.
          spans={name: range(c,c+4) for c,name in headers}
          sat_start=None
          next_day=None
          for rr in range(sh.nrows):
              d=str(sh.cell_value(rr,0)).strip().lower()
              if 'суббот' in d:
                  sat_start=rr
              elif sat_start is not None and rr>sat_start and d:
                  next_day=rr
                  break
          if sat_start is None:
              raise RuntimeError('Saturday row not found')
          sat_end=next_day if next_day is not None else sh.nrows
          print('SATURDAY_RANGE', sat_start, sat_end-1)

          total_nonempty=0
          for name, cols in spans.items():
              hits=[]
              for rr in range(sat_start,sat_end):
                  for cc in cols:
                      v=str(sh.cell_value(rr,cc)).strip()
                      if v:
                          hits.append((rr,cc,v))
              print('SATURDAY_GROUP', name, 'NONEMPTY', len(hits), hits)
              total_nonempty += len(hits)

          print('SATURDAY_TOTAL_NONEMPTY_BBI26', total_nonempty)
          print('SATURDAY_ALL_BBI26_EMPTY', total_nonempty == 0)

          # Print the exact Saturday matrix for independent visual verification.
          print('--- SATURDAY_MATRIX c0..c30 ---')
          for rr in range(sat_start,sat_end):
              vals=[]
              for cc in range(0,31):
                  v=str(sh.cell_value(rr,cc)).replace('\n',' / ').strip()
                  if v:
                      vals.append(f'c{cc}={v}')
              print(f'r{rr}: ' + (' | '.join(vals) if vals else '<EMPTY>'))
          PY
