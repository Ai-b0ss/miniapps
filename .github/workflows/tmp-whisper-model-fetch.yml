name: Temporary Whisper Model Fetch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-models:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models
          curl --fail --location --retry 5 --retry-all-errors \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/c521a4b02f422512d734391fdf08bb08c0862f68/ggml-base-q5_1.bin?download=true' \
            --output models/ggml-base-q5_1.bin
          curl --fail --location --retry 5 --retry-all-errors \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/c521a4b02f422512d734391fdf08bb08c0862f68/ggml-small-q5_1.bin?download=true' \
            --output models/ggml-small-q5_1.bin
          printf '%s  %s\n' \
            '422f1ae452ade6f30a004d7e5c6a43195e4433bc370bf23fac9cc591f01a8898' 'models/ggml-base-q5_1.bin' \
            'ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb' 'models/ggml-small-q5_1.bin' \
            | sha256sum --check --strict
          ls -lh models

      - name: Upload verified models
        uses: actions/upload-artifact@v4
        with:
          name: whisper-models-ru
          path: models/*.bin
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
