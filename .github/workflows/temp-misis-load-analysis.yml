name: TEMP MISIS load analysis

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze MISIS BBI workload
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q requests xlrd
          python - <<'PY'
          import requests, xlrd, statistics, collections, json

          URL='https://misis.ru/files/-/a20e90e9422cb6229fc49ee8005324ac/itkn-250826.xls'
          r=requests.get(URL, timeout=45, headers={'User-Agent':'Mozilla/5.0'})
          print('HTTP', r.status_code, 'BYTES', len(r.content), 'TYPE', r.headers.get('content-type'))
          r.raise_for_status()
          wb=xlrd.open_workbook(file_contents=r.content)
          DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье']

          def med(xs):
              return statistics.median(xs) if xs else 0
          def mode(xs):
              if not xs: return None
              c=collections.Counter(xs)
              m=max(c.values())
              return sorted([k for k,v in c.items() if v==m])[0]

          all_results={}
          for sheet_name in ['1 курс','2 курс','3 курс','4 курс']:
              sh=wb.sheet_by_name(sheet_name)
              headers=[]
              for c in range(sh.ncols):
                  s=str(sh.cell_value(0,c)).strip()
                  if s.upper().startswith('ББИ-'):
                      headers.append((c,s))
              # Day ranges.
              starts=[]
              for rr in range(sh.nrows):
                  d=str(sh.cell_value(rr,0)).strip()
                  if d in DAYS:
                      starts.append((rr,d))
              day_ranges={}
              for i,(rr,d) in enumerate(starts):
                  day_ranges[d]=(rr, starts[i+1][0] if i+1<len(starts) else sh.nrows)

              variants=[]
              group_summaries={}
              for idx,(c,name) in enumerate(headers):
                  next_c=headers[idx+1][0] if idx+1<len(headers) else sh.ncols
                  width=min(4, max(2,next_c-c))
                  # Subject columns are c and, when present, c+2. Validate via row 1 labels when possible.
                  subj_cols=[c]
                  if width>=4 and c+2<next_c:
                      subj_cols.append(c+2)
                  gv=[]
                  for sg_i,sc in enumerate(subj_cols,1):
                      for week_i,offset in enumerate([0,1],1):
                          daily={}
                          weekly_pairs=0; weekly_windows=0; active_days=0
                          for d in DAYS:
                              a,b=day_ranges[d]
                              slots=[]
                              slot_no=0
                              rr=a
                              while rr<b:
                                  # First row of each pair carries the slot number/time, second row is alternate week.
                                  if str(sh.cell_value(rr,1)).strip():
                                      slot_no=int(float(sh.cell_value(rr,1)))
                                      base_rr=rr
                                      target_rr=rr+offset
                                      if target_rr < b:
                                          subj=str(sh.cell_value(target_rr,sc)).strip()
                                          if subj:
                                              time=str(sh.cell_value(base_rr,2)).strip()
                                              slots.append((slot_no,time,subj))
                                  rr+=1
                              if slots:
                                  active_days += 1
                                  weekly_pairs += len(slots)
                                  nums=[x[0] for x in slots]
                                  wins=(max(nums)-min(nums)+1)-len(nums)
                                  weekly_windows += wins
                                  daily[d]={
                                      'pairs':len(slots),
                                      'start':slots[0][1].split(' - ')[0],
                                      'end':slots[-1][1].split(' - ')[-1],
                                      'windows':wins,
                                      'slot_nums':nums,
                                  }
                              else:
                                  daily[d]={'pairs':0,'start':None,'end':None,'windows':0,'slot_nums':[]}
                          rec={'course':sheet_name,'group':name,'sg':sg_i,'week':week_i,
                               'weekly_pairs':weekly_pairs,'active_days':active_days,'weekly_windows':weekly_windows,'daily':daily}
                          variants.append(rec); gv.append(rec)
                  gpairs=[v['weekly_pairs'] for v in gv]; gwins=[v['weekly_windows'] for v in gv]
                  latest=[]; startsx=[]; maxdaily=[]
                  for v in gv:
                      maxdaily.append(max(x['pairs'] for x in v['daily'].values()))
                      for x in v['daily'].values():
                          if x['end']: latest.append(x['end'])
                          if x['start']: startsx.append(x['start'])
                  group_summaries[name]={
                      'variants':len(gv),
                      'weekly_pairs_min':min(gpairs),'weekly_pairs_med':med(gpairs),'weekly_pairs_max':max(gpairs),
                      'weekly_windows_min':min(gwins),'weekly_windows_med':med(gwins),'weekly_windows_max':max(gwins),
                      'max_daily_pairs':max(maxdaily),
                      'earliest_start':min(startsx) if startsx else None,
                      'latest_end':max(latest) if latest else None,
                      'sat_variants_with_classes':sum(1 for v in gv if v['daily']['Суббота']['pairs']>0),
                  }
              # Aggregate course.
              wp=[v['weekly_pairs'] for v in variants]; ww=[v['weekly_windows'] for v in variants]; ad=[v['active_days'] for v in variants]
              course_summary={
                  'groups':len(headers),'variants':len(variants),
                  'weekly_pairs_min':min(wp),'weekly_pairs_med':med(wp),'weekly_pairs_max':max(wp),
                  'active_days_min':min(ad),'active_days_med':med(ad),'active_days_max':max(ad),
                  'weekly_windows_min':min(ww),'weekly_windows_med':med(ww),'weekly_windows_max':max(ww),
              }
              day_summary={}
              for d in DAYS:
                  vals=[v['daily'][d] for v in variants]
                  p=[x['pairs'] for x in vals]
                  active=[x for x in vals if x['pairs']>0]
                  day_summary[d]={
                      'active_pct':round(100*len(active)/len(vals),1),
                      'pairs_min':min(p),'pairs_med':med(p),'pairs_max':max(p),
                      'active_pairs_med':med([x['pairs'] for x in active]),
                      'start_mode':mode([x['start'] for x in active]),
                      'end_mode':mode([x['end'] for x in active]),
                      'earliest_start':min([x['start'] for x in active]) if active else None,
                      'latest_end':max([x['end'] for x in active]) if active else None,
                      'windows_med':med([x['windows'] for x in vals]),
                      'windows_max':max([x['windows'] for x in vals]),
                  }
              all_results[sheet_name]={'course':course_summary,'days':day_summary,'groups':group_summaries}

          for course,data in all_results.items():
              print('COURSE_JSON', course, json.dumps(data['course'],ensure_ascii=False,sort_keys=True))
              for d,x in data['days'].items():
                  print('DAY_JSON', course, d, json.dumps(x,ensure_ascii=False,sort_keys=True))
              for g,x in data['groups'].items():
                  print('GROUP_JSON', course, g, json.dumps(x,ensure_ascii=False,sort_keys=True))
          PY
