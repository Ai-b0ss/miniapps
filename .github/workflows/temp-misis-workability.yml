name: TEMP MISIS workability deep dive

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Compute workability and transitions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q requests xlrd
          python - <<'PY'
          import requests, xlrd, collections, re, statistics, math
          URL='https://misis.ru/files/-/a20e90e9422cb6229fc49ee8005324ac/itkn-250826.xls'
          r=requests.get(URL,timeout=45,headers={'User-Agent':'Mozilla/5.0'}); r.raise_for_status()
          wb=xlrd.open_workbook(file_contents=r.content)
          DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота']
          WEEKDAYS=DAYS[:5]

          def mins(t):
              h,m,*_=map(int,t.split(':')); return h*60+m
          def work_hours(slots):
              # contiguous work time inside 09:00-18:00 only before first or after last class; ignore tiny fragments under 2h
              if not slots: return 9.0
              st=mins(slots[0][1].split(' - ')[0]); en=mins(slots[-1][1].split(' - ')[-1])
              pre=max(0,st-9*60); post=max(0,18*60-en)
              return round(sum(x for x in [pre,post] if x>=120)/60,2)
          def bprefix(room):
              x=room.strip().upper().replace('Ё','Е')
              if not x: return ''
              if 'СПОРТИВ' in x: return 'SPORT'
              if 'КАФ. ИЯКТ' in x or 'ИЯКТ' in x: return 'ИЯКТ'
              m=re.match(r'([А-ЯA-Z])[-–]',x)
              if m: return m.group(1)
              return x[:12]

          for course in ['1 курс','2 курс','3 курс','4 курс']:
              sh=wb.sheet_by_name(course)
              hs=[]
              for c in range(sh.ncols):
                  s=str(sh.cell_value(0,c)).strip()
                  if s.upper().startswith('ББИ-'): hs.append((c,s))
              starts=[]
              for rr in range(sh.nrows):
                  d=str(sh.cell_value(rr,0)).strip()
                  if d in DAYS+['Воскресенье']: starts.append((rr,d))
              dr={d:(rr, starts[i+1][0] if i+1<len(starts) else sh.nrows) for i,(rr,d) in enumerate(starts)}
              allvars=[]; groupvars=collections.defaultdict(list); trans=collections.Counter(); route_days=0; total_adj=0
              for i,(c,g) in enumerate(hs):
                  nc=hs[i+1][0] if i+1<len(hs) else sh.ncols
                  width=min(4,max(2,nc-c)); scols=[c]+([c+2] if width>=4 and c+2<nc else [])
                  for sg_i,sc in enumerate(scols,1):
                      roomc=sc+1
                      for off in [0,1]:
                          dayrec={}; weekly_pairs=0; officehours=0; free=[]; heavy=0; transitions=0; external=0
                          for d in DAYS:
                              a,b=dr[d]; slots=[]
                              for rr in range(a,b):
                                  if str(sh.cell_value(rr,1)).strip():
                                      tr=rr+off
                                      if tr<b:
                                          subj=str(sh.cell_value(tr,sc)).strip()
                                          if subj:
                                              num=int(float(sh.cell_value(rr,1))); tm=str(sh.cell_value(rr,2)).strip(); room=str(sh.cell_value(tr,roomc)).strip()
                                              slots.append((num,tm,subj,room,bprefix(room)))
                              dayrec[d]=slots; weekly_pairs+=len(slots)
                              if d in WEEKDAYS:
                                  officehours += work_hours(slots)
                                  if not slots: free.append(d)
                              if len(slots)>=4: heavy+=1
                              prefs=[x[4] for x in slots if x[4]]
                              if any(p in ('SPORT','ИЯКТ') for p in prefs): external+=1
                              # consecutive class building-prefix changes
                              for x,y in zip(slots,slots[1:]):
                                  if x[0]+1==y[0]:
                                      total_adj+=1
                                      if x[4] and y[4] and x[4]!=y[4]:
                                          transitions+=1; trans[(x[4],y[4])]+=1
                              if transitions: route_days += 0 # kept at variant level below
                          rec={'g':g,'sg':sg_i,'w':off+1,'pairs':weekly_pairs,'office':round(officehours,2),'free':tuple(free),'heavy':heavy,'trans':transitions,'external':external,'days':dayrec}
                          allvars.append(rec); groupvars[g].append(rec)
              print('\n===',course,'===')
              print('OFFICE_HOURS_WEEK_DIST_MIN_MED_MAX',min(v['office'] for v in allvars),statistics.median(v['office'] for v in allvars),max(v['office'] for v in allvars))
              print('TRANSITION_VARIANTS_WITH_ANY',sum(v['trans']>0 for v in allvars),'/',len(allvars),'TOTAL_TRANS',sum(v['trans'] for v in allvars),'TOP',trans.most_common(12))
              print('EXTERNAL_DAY_VARIANTS_DIST',dict(collections.Counter(v['external'] for v in allvars)))
              for g,recs in groupvars.items():
                  print('WORK_GROUP',g,
                        'pairs',sorted(set(v['pairs'] for v in recs)),
                        'office_hours',sorted(set(v['office'] for v in recs)),
                        'office_min',min(v['office'] for v in recs),
                        'office_avg',round(statistics.mean(v['office'] for v in recs),2),
                        'free_sets',sorted(set(v['free'] for v in recs)),
                        'heavy',sorted(set(v['heavy'] for v in recs)),
                        'transitions',sorted(set(v['trans'] for v in recs)),
                        'external_days',sorted(set(v['external'] for v in recs)))
                  if course=='2 курс':
                      for v in sorted(recs,key=lambda z:(z['sg'],z['w'])):
                          print('WEEK2_DETAIL',g,'sg',v['sg'],'week',v['w'],'pairs',v['pairs'],'office',v['office'],'free',v['free'])
                          for d in WEEKDAYS:
                              slots=v['days'][d]
                              if not slots:
                                  print(' DAY',d,'FREE work=9.0')
                              else:
                                  st=slots[0][1].split(' - ')[0]; en=slots[-1][1].split(' - ')[-1]
                                  print(' DAY',d,f'{st}-{en}',len(slots),'pairs','work',work_hours(slots))
          PY
