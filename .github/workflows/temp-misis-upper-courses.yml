name: TEMP MISIS upper courses

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Parse MISIS BBI courses 2-4 Saturdays
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q requests xlrd
          python - <<'PY'
          import requests, xlrd, re
          url='https://misis.ru/files/-/a20e90e9422cb6229fc49ee8005324ac/itkn-250826.xls'
          r=requests.get(url, timeout=45, headers={'User-Agent':'Mozilla/5.0'})
          print('HTTP', r.status_code, 'BYTES', len(r.content), 'TYPE', r.headers.get('content-type'))
          r.raise_for_status()
          wb=xlrd.open_workbook(file_contents=r.content)
          print('SHEETS', wb.sheet_names())
          for sheet_name in ['2 курс','3 курс','4 курс']:
              sh=wb.sheet_by_name(sheet_name)
              headers=[]
              for c in range(sh.ncols):
                  s=str(sh.cell_value(0,c)).strip()
                  if s.upper().startswith('ББИ-'):
                      headers.append((c,s))
              print('\n===', sheet_name, '===')
              print('TARGET_GROUPS', headers)
              sat_start=None; sat_end=None
              for rr in range(sh.nrows):
                  d=str(sh.cell_value(rr,0)).strip().lower()
                  if sat_start is None and 'суббот' in d:
                      sat_start=rr
                  elif sat_start is not None and rr>sat_start and d:
                      sat_end=rr; break
              print('SATURDAY_RANGE', sat_start, (sat_end-1 if sat_end else sh.nrows-1))
              if sat_start is None:
                  continue
              if sat_end is None: sat_end=sh.nrows
              for idx,(c,name) in enumerate(headers):
                  next_c=headers[idx+1][0] if idx+1<len(headers) else sh.ncols
                  # Usually 4 cols/group; limit by next header to avoid stealing neighbour group.
                  width=min(4, max(1,next_c-c))
                  cols=range(c,c+width)
                  hits=[]
                  for rr in range(sat_start,sat_end):
                      vals=[]
                      for cc in cols:
                          v=str(sh.cell_value(rr,cc)).replace('\n',' / ').strip()
                          if v:
                              vals.append((cc,v))
                      if vals:
                          time=str(sh.cell_value(rr,2)).strip() if sh.ncols>2 else ''
                          num=str(sh.cell_value(rr,1)).strip() if sh.ncols>1 else ''
                          hits.append((rr,num,time,vals))
                  print('GROUP', name, 'COLS', list(cols), 'SATURDAY_HITS', len(hits))
                  for h in hits:
                      print('  ', h)
          PY
