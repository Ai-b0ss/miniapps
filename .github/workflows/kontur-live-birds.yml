name: kontur-live-birds

on:
  push:
    branches: [tmp/hf-portfolio-inspect-20260830]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live Cloudflare product surface
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://kontur-igor.igorekglukhovskii43.workers.dev'
          mkdir -p live/assets
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors --connect-timeout 10 --max-time 45 "$ORIGIN/" -o live/root.html
          grep -oE 'src=["'"'][^"'"']+\.js["'"']' live/root.html | sed -E 's/^src=["'"']//;s/["'"']$//' > live/js-paths.txt || true
          : > live/live.js
          while IFS= read -r js; do
            [ -n "$js" ] || continue
            case "$js" in
              http://*|https://*) url="$js" ;;
              /*) url="$ORIGIN$js" ;;
              *) url="$ORIGIN/$js" ;;
            esac
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 45 "$url" >> live/live.js
            printf '\n' >> live/live.js
          done < live/js-paths.txt
          grep -oE '/(results|birds)/[A-Za-z0-9._/-]+' live/live.js | sort -u > live/live-bird-refs.txt || true

          cat > live/candidates.txt <<'EOF'
          /results/magpie.webp
          /results/magpie-amber.webp
          /results/magpie-northern.webp
          /results/woodpecker.webp
          /results/jay.webp
          /results/crane.webp
          /results/crane-character-v4.webp
          /results/crane-collectible.svg
          /results/owl.webp
          /results/kotosov.webp
          /birds/magpie.webp
          /birds/woodpecker.webp
          /birds/jay.webp
          /birds/crane.webp
          /birds/owl.webp
          EOF

          : > live/http-report.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            name="$(printf '%s' "$path" | sed 's#^/##;s#/#__#g')"
            code="$(curl --location --silent --show-error --retry 3 --retry-all-errors --connect-timeout 10 --max-time 45 -w '%{http_code}' -o "live/assets/$name" "$ORIGIN$path" || true)"
            if [ "$code" = '200' ]; then
              bytes="$(wc -c <"live/assets/$name" | tr -d ' ')"
              sha="$(sha256sum "live/assets/$name" | awk '{print $1}')"
              printf '%s\tHTTP 200\t%s bytes\t%s\n' "$path" "$bytes" "$sha" | tee -a live/http-report.txt
            else
              rm -f "live/assets/$name"
              printf '%s\tHTTP %s\n' "$path" "$code" | tee -a live/http-report.txt
            fi
          done < live/candidates.txt
      - name: Build visual contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          root=Path('live/assets')
          items=[]
          for p in sorted(root.iterdir()):
              if p.suffix.lower() not in {'.webp','.png','.jpg','.jpeg'}: continue
              try:
                  im=Image.open(p).convert('RGBA')
              except Exception:
                  continue
              items.append((p,im))
          if not items: raise SystemExit('NO_RASTER_BIRD_ASSETS')
          cell_w,cell_h=440,390
          cols=3
          rows=(len(items)+cols-1)//cols
          sheet=Image.new('RGB',(cell_w*cols,cell_h*rows),(8,12,19))
          d=ImageDraw.Draw(sheet)
          font=ImageFont.load_default()
          for idx,(p,im) in enumerate(items):
              x=(idx%cols)*cell_w; y=(idx//cols)*cell_h
              box=(x+20,y+42,x+cell_w-20,y+cell_h-38)
              iw,ih=im.size
              scale=min((box[2]-box[0])/iw,(box[3]-box[1])/ih,1.5)
              nw=max(1,int(iw*scale)); nh=max(1,int(ih*scale))
              r=im.resize((nw,nh),Image.Resampling.LANCZOS)
              canvas=Image.new('RGBA',(box[2]-box[0],box[3]-box[1]),(16,22,31,255))
              canvas.alpha_composite(r,((canvas.width-nw)//2,(canvas.height-nh)//2))
              sheet.paste(canvas.convert('RGB'),(box[0],box[1]))
              label=p.name.replace('__','/')
              d.text((x+18,y+15),label,fill=(220,232,241),font=font)
              d.text((x+18,y+cell_h-27),f'{iw}x{ih} · {p.stat().st_size} bytes',fill=(135,154,174),font=font)
          sheet.save('live/contact-sheet.png',quality=95)
          print('contact sheet:',len(items),'assets',sheet.size)
          PY
      - name: Capture current live app overview
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > live/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true});
          const c=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:1});
          const p=await c.newPage();
          const errors=[]; p.on('pageerror',e=>errors.push(String(e)));
          const r=await p.goto('https://kontur-igor.igorekglukhovskii43.workers.dev/',{waitUntil:'networkidle',timeout:60000});
          await p.waitForTimeout(1500);
          await p.screenshot({path:'live/live-app-390.png',fullPage:false});
          console.log(JSON.stringify({status:r?.status(),url:p.url(),title:await p.title(),errors}));
          await c.close(); await b.close();
          JS
          node live/capture.mjs | tee live/browser-report.txt
          rm live/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: kontur-live-birds
          path: live/
          retention-days: 1
