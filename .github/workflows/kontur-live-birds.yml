name: kontur-live-birds

on:
  push:
    branches: [tmp/hf-portfolio-inspect-20260830]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live Cloudflare product surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live/assets
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, urllib.request, urllib.error

          origin='https://kontur-igor.igorekglukhovskii43.workers.dev'
          out=Path('live'); assets=out/'assets'
          headers={'User-Agent':'Mozilla/5.0 (GitHub Actions Kontur read-only audit)'}
          def fetch(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=40) as r:
                  return r.status, r.headers, r.read()

          status, headers_obj, html=fetch(origin+'/')
          (out/'root.html').write_bytes(html)
          text=html.decode('utf-8','replace')
          js_paths=re.findall(r'''src=["']([^"']+\.js)["']''',text,re.I)
          (out/'js-paths.txt').write_text('\n'.join(js_paths),encoding='utf-8')
          bundle=[]
          for p in js_paths:
              url=p if p.startswith(('http://','https://')) else origin+'/'+p.lstrip('/')
              try:
                  _,_,data=fetch(url); bundle.append(data.decode('utf-8','replace'))
              except Exception as e:
                  bundle.append(f'/* fetch failed {url}: {type(e).__name__} */')
          joined='\n'.join(bundle)
          (out/'live.js').write_text(joined,encoding='utf-8')
          refs=sorted(set(re.findall(r'/(?:results|birds)/[A-Za-z0-9._/-]+',joined)))
          (out/'live-bird-refs.txt').write_text('\n'.join(refs),encoding='utf-8')

          candidates=[
            '/results/magpie.webp','/results/magpie-amber.webp','/results/magpie-northern.webp',
            '/results/woodpecker.webp','/results/jay.webp','/results/crane.webp',
            '/results/crane-character-v4.webp','/results/crane-collectible.svg',
            '/results/owl.webp','/results/kotosov.webp',
            '/birds/magpie.webp','/birds/woodpecker.webp','/birds/jay.webp','/birds/crane.webp','/birds/owl.webp',
          ]
          report=[]
          for path in candidates:
              name=path.lstrip('/').replace('/','__')
              try:
                  code,h,data=fetch(origin+path)
                  (assets/name).write_bytes(data)
                  sha=hashlib.sha256(data).hexdigest()
                  report.append(f'{path}\tHTTP {code}\t{len(data)} bytes\t{sha}\t{h.get("content-type","")}')
              except urllib.error.HTTPError as e:
                  report.append(f'{path}\tHTTP {e.code}')
              except Exception as e:
                  report.append(f'{path}\tERROR {type(e).__name__}: {e}')
          (out/'http-report.txt').write_text('\n'.join(report),encoding='utf-8')
          print(f'root_http={status} js={len(js_paths)} live_refs={len(refs)}')
          print('\n'.join(report))
          PY
      - name: Build visual contact sheet
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          root=Path('live/assets'); items=[]
          for p in sorted(root.iterdir()):
              if p.suffix.lower() not in {'.webp','.png','.jpg','.jpeg'}: continue
              try: im=Image.open(p).convert('RGBA')
              except Exception: continue
              items.append((p,im))
          if not items: raise SystemExit('NO_RASTER_BIRD_ASSETS')
          cell_w,cell_h,cols=440,390,3
          rows=(len(items)+cols-1)//cols
          sheet=Image.new('RGB',(cell_w*cols,cell_h*rows),(8,12,19)); d=ImageDraw.Draw(sheet); font=ImageFont.load_default()
          for idx,(p,im) in enumerate(items):
              x=(idx%cols)*cell_w; y=(idx//cols)*cell_h; iw,ih=im.size
              box=(x+20,y+42,x+cell_w-20,y+cell_h-38)
              scale=min((box[2]-box[0])/iw,(box[3]-box[1])/ih,1.5)
              nw=max(1,int(iw*scale)); nh=max(1,int(ih*scale)); r=im.resize((nw,nh),Image.Resampling.LANCZOS)
              canvas=Image.new('RGBA',(box[2]-box[0],box[3]-box[1]),(16,22,31,255)); canvas.alpha_composite(r,((canvas.width-nw)//2,(canvas.height-nh)//2))
              sheet.paste(canvas.convert('RGB'),(box[0],box[1]))
              d.text((x+18,y+15),p.name.replace('__','/'),fill=(220,232,241),font=font)
              d.text((x+18,y+cell_h-27),f'{iw}x{ih} · {p.stat().st_size} bytes',fill=(135,154,174),font=font)
          sheet.save('live/contact-sheet.png')
          print('contact_sheet_assets',len(items),'size',sheet.size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kontur-live-birds
          path: live/
          retention-days: 1
