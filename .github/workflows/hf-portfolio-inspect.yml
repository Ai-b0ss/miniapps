name: hf-portfolio-inspect

on:
  push:
    branches:
      - tmp/hf-portfolio-inspect-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Hugging Face metadata and repository tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hf_snapshot
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          curl --retry 3 --retry-delay 2 -fsSL -A "$UA" \
            'https://huggingface.co/api/spaces/i99er/igor-portfolio' \
            -o hf_snapshot/meta.json
          curl --retry 3 --retry-delay 2 -fsSL -A "$UA" \
            'https://huggingface.co/api/spaces/i99er/igor-portfolio/tree/main?recursive=true&expand=false' \
            -o hf_snapshot/tree.json
          python - <<'PY'
          import json, pathlib
          m=json.load(open('hf_snapshot/meta.json',encoding='utf-8'))
          t=json.load(open('hf_snapshot/tree.json',encoding='utf-8'))
          print('HF_META_BEGIN')
          for k in ('id','author','sha','lastModified','private','disabled','gated','sdk','subdomain'):
              print(f'{k}={m.get(k)!r}')
          print('HF_TREE_BEGIN')
          items=t if isinstance(t,list) else t.get('items',[])
          for x in items:
              print(x.get('path'), x.get('type'), x.get('size'))
          print('HF_TREE_END')
          pathlib.Path('hf_snapshot/files.txt').write_text('\n'.join(str(x.get('path')) for x in items if x.get('type')=='file'),encoding='utf-8')
          PY

      - name: Fetch public text sources
        shell: bash
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          python - <<'PY'
          import json, urllib.parse, urllib.request, pathlib
          tree=json.load(open('hf_snapshot/tree.json',encoding='utf-8'))
          items=tree if isinstance(tree,list) else tree.get('items',[])
          allowed={'.html','.css','.js','.mjs','.cjs','.ts','.tsx','.jsx','.json','.md','.txt','.py','.yml','.yaml'}
          out=pathlib.Path('hf_snapshot/repo'); out.mkdir(parents=True,exist_ok=True)
          for x in items:
              if x.get('type')!='file': continue
              p=x.get('path') or ''
              if pathlib.Path(p).suffix.lower() not in allowed: continue
              if (x.get('size') or 0)>1_500_000: continue
              url='https://huggingface.co/spaces/i99er/igor-portfolio/resolve/main/'+urllib.parse.quote(p,safe='/')+'?download=true'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              try:
                  data=urllib.request.urlopen(req,timeout=30).read()
              except Exception as e:
                  print('FETCH_FAIL',p,type(e).__name__,e)
                  continue
              dest=out/p; dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(data)
              print('FETCH_OK',p,len(data))
          PY
          echo 'SOURCE_SCAN_BEGIN'
          find hf_snapshot/repo -type f -maxdepth 6 -print | sort
          echo 'SOURCE_SCAN_END'

      - name: Install Playwright browsers
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit

      - name: Live mobile and desktop audit
        shell: bash
        run: |
          set -euo pipefail
          cat > hf_snapshot/audit.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          import fs from 'node:fs';
          const hub='https://huggingface.co/spaces/i99er/igor-portfolio';
          let meta={}; try { meta=JSON.parse(fs.readFileSync('hf_snapshot/meta.json','utf8')); } catch {}
          const direct = meta.subdomain ? `https://${meta.subdomain}.hf.space` : 'https://i99er-igor-portfolio.hf.space';
          const targets=[['hub',hub],['direct',direct]];
          const configs=[
            ['chromium-mobile',chromium,{viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:3}],
            ['webkit-mobile',webkit,{viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:3}],
            ['chromium-desktop',chromium,{viewport:{width:1440,height:1100},deviceScaleFactor:1}],
          ];
          const report=[];
          for (const [engineName, engine, contextOpts] of configs) {
            const browser=await engine.launch({headless:true});
            const context=await browser.newContext({...contextOpts, locale:'ru-RU'});
            for (const [targetName,url] of targets) {
              const page=await context.newPage(); const consoleErrors=[]; const pageErrors=[]; const failed=[];
              page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text().slice(0,500));});
              page.on('pageerror',e=>pageErrors.push(String(e).slice(0,500)));
              page.on('requestfailed',r=>failed.push(`${r.method()} ${r.url()} :: ${r.failure()?.errorText||''}`.slice(0,700)));
              let status=null, finalUrl=null, gotoError=null;
              for(let attempt=1; attempt<=3; attempt++) {
                try {
                  const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
                  status=resp?.status()??null; finalUrl=page.url();
                  await page.waitForTimeout(attempt===1?12000:25000);
                  if((await page.locator('body').innerText().catch(()=>'' )).trim().length>80) break;
                } catch(e) { gotoError=String(e).slice(0,800); }
              }
              const metrics=await page.evaluate(()=>{
                const de=document.documentElement,b=document.body;
                const all=[...document.querySelectorAll('*')];
                const offenders=all.map(el=>{const r=el.getBoundingClientRect(); return {tag:el.tagName,id:el.id,cls:typeof el.className==='string'?el.className.slice(0,100):'',left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),position:getComputedStyle(el).position};})
                  .filter(x=>x.right>innerWidth+2||x.left<-2||x.width>innerWidth+2).slice(0,80);
                return {innerWidth,innerHeight,scrollWidth:Math.max(de.scrollWidth,b?.scrollWidth||0),scrollHeight:Math.max(de.scrollHeight,b?.scrollHeight||0),bodyText:(b?.innerText||'').slice(0,4000),title:document.title,iframes:[...document.querySelectorAll('iframe')].map(f=>({src:f.src,width:f.getBoundingClientRect().width,height:f.getBoundingClientRect().height})),offenders};
              }).catch(e=>({evalError:String(e)}));
              const stem=`${engineName}-${targetName}`;
              await page.screenshot({path:`hf_snapshot/${stem}.png`,fullPage:true}).catch(()=>{});
              report.push({engineName,targetName,url,status,finalUrl,gotoError,metrics,consoleErrors,pageErrors,failedRequests:failed.slice(0,60)});
              console.log('AUDIT_RESULT',JSON.stringify(report.at(-1)));
              await page.close();
            }
            await context.close(); await browser.close();
          }
          fs.writeFileSync('hf_snapshot/audit-report.json',JSON.stringify({direct,report},null,2));
          JS
          node hf_snapshot/audit.mjs

      - name: Print source excerpts useful for responsive diagnosis
        shell: bash
        run: |
          set -euo pipefail
          echo 'RESPONSIVE_SOURCE_BEGIN'
          grep -RniE 'viewport|@media|min-width|max-width|width:[[:space:]]*[0-9]{3,}px|100vw|overflow|position:[[:space:]]*(fixed|absolute)|grid-template|flex-wrap|iframe' hf_snapshot/repo 2>/dev/null | head -n 500 || true
          echo 'RESPONSIVE_SOURCE_END'
          python - <<'PY'
          import json
          r=json.load(open('hf_snapshot/audit-report.json',encoding='utf-8'))
          print('AUDIT_SUMMARY_BEGIN')
          for x in r['report']:
              m=x.get('metrics') or {}
              print(x['engineName'],x['targetName'],'status=',x.get('status'),'final=',x.get('finalUrl'),'inner=',m.get('innerWidth'),'scroll=',m.get('scrollWidth'),'iframes=',m.get('iframes'),'offenders=',len(m.get('offenders') or []),'consoleErrors=',len(x.get('consoleErrors') or []),'failed=',len(x.get('failedRequests') or []))
              if m.get('offenders'): print('OFFENDERS',json.dumps(m['offenders'][:20],ensure_ascii=False))
          print('AUDIT_SUMMARY_END')
          PY

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: hf-portfolio-inspection
          path: hf_snapshot
          if-no-files-found: error
          retention-days: 1
