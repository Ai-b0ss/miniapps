name: hf-mobile-audit-fast

on:
  push:
    branches: [tmp/hf-portfolio-inspect-20260830]

permissions:
  contents: read

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[snapshot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
      - name: Diagnose exact live host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          cat > audit/run.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          import fs from 'node:fs';
          const url='https://i99er-igor-portfolio.static.hf.space/';
          const cases=[
            ['webkit-320',webkit,320,568],['webkit-389',webkit,389,844],['webkit-390',webkit,390,844],['webkit-391',webkit,391,844],['webkit-430',webkit,430,932],
            ['chromium-390',chromium,390,844],['chromium-1440',chromium,1440,1100]
          ];
          const out=[];
          for (const [name,engine,w,h] of cases){
            const b=await engine.launch({headless:true}); const c=await b.newContext({viewport:{width:w,height:h},isMobile:w<600,hasTouch:w<600,deviceScaleFactor:w<600?2:1,locale:'ru-RU'}); const p=await c.newPage();
            const ce=[],pe=[],rf=[]; p.on('console',m=>{if(m.type()==='error')ce.push(m.text())}); p.on('pageerror',e=>pe.push(String(e))); p.on('requestfailed',r=>rf.push(`${r.url()} :: ${r.failure()?.errorText||''}`));
            let status=null,err=null; try{const r=await p.goto(url,{waitUntil:'networkidle',timeout:45000});status=r?.status()??null;}catch(e){err=String(e)} await p.waitForTimeout(1800);
            const m=await p.evaluate(()=>{const de=document.documentElement,body=document.body,els=[...document.querySelectorAll('*')];const rect=el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return {tag:el.tagName,cls:typeof el.className==='string'?el.className.slice(0,110):'',text:(el.textContent||'').trim().slice(0,70),top:Math.round(r.top+scrollY),bottom:Math.round(r.bottom+scrollY),left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),height:Math.round(r.height),display:s.display,position:s.position,font:s.fontSize,overflow:s.overflow,transform:s.transform}};const visible=els.filter(el=>{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return s.display!=='none'&&r.width>0&&r.height>0});const tall=visible.map(rect).sort((a,b)=>b.height-a.height).slice(0,35);const bad=visible.map(rect).filter(x=>x.left<-3||x.right>innerWidth+3||x.width>innerWidth+3).slice(0,80);const sections=[...document.querySelectorAll('main>section,.section,.wow-spread')].map(rect);return {iw:innerWidth,ih:innerHeight,sw:Math.max(de.scrollWidth,body?.scrollWidth||0),sh:Math.max(de.scrollHeight,body?.scrollHeight||0),title:document.title,bad,tall,sections,htmlFont:getComputedStyle(de).fontSize,bodyFont:getComputedStyle(body).fontSize,sticky:[...document.querySelectorAll('.sticky-contact')].map(rect)};});
            const rec={name,status,err,m,consoleErrors:ce,pageErrors:pe,failedRequests:rf.slice(0,30)};out.push(rec);console.log('RESULT',JSON.stringify(rec));
            for(const y of [0,Math.max(0,Math.round(m.sh*.25)),Math.max(0,Math.round(m.sh*.5)),Math.max(0,Math.round(m.sh*.75))]){await p.evaluate(y=>scrollTo(0,y),y);await p.waitForTimeout(100);await p.screenshot({path:`audit/${name}-${y}.png`,fullPage:false});}
            await c.close();await b.close();
          }
          fs.writeFileSync('audit/report.json',JSON.stringify(out,null,2));
          JS
          node audit/run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hf-mobile-audit-diagnostic
          path: audit
          retention-days: 1
