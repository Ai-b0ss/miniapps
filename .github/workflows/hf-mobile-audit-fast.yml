name: hf-mobile-audit-fast

on:
  push:
    branches: [tmp/hf-portfolio-inspect-20260830]

permissions:
  contents: read

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[snapshot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i --no-audit --no-fund playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium webkit >/dev/null
      - name: Audit exact live host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          cat > audit/run.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          import fs from 'node:fs';
          const url='https://i99er-igor-portfolio.static.hf.space/';
          const cases=[
            ['webkit-320',webkit,{viewport:{width:320,height:568},isMobile:true,hasTouch:true,deviceScaleFactor:2}],
            ['webkit-390',webkit,{viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:3}],
            ['chromium-390',chromium,{viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:3}],
            ['chromium-1440',chromium,{viewport:{width:1440,height:1100},deviceScaleFactor:1}],
          ];
          const out=[];
          for (const [name,engine,opts] of cases){
            const b=await engine.launch({headless:true}); const c=await b.newContext({...opts,locale:'ru-RU'}); const p=await c.newPage();
            const ce=[],pe=[],rf=[]; p.on('console',m=>{if(m.type()==='error')ce.push(m.text())}); p.on('pageerror',e=>pe.push(String(e))); p.on('requestfailed',r=>rf.push(`${r.url()} :: ${r.failure()?.errorText||''}`));
            let status=null,err=null; try{const r=await p.goto(url,{waitUntil:'networkidle',timeout:45000});status=r?.status()??null;}catch(e){err=String(e)}
            await p.waitForTimeout(2500);
            const m=await p.evaluate(()=>{const de=document.documentElement,body=document.body;const els=[...document.querySelectorAll('*')];const bad=els.map(el=>{const r=el.getBoundingClientRect();const s=getComputedStyle(el);return {tag:el.tagName,cls:typeof el.className==='string'?el.className.slice(0,90):'',left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),display:s.display,position:s.position,font:Math.round(parseFloat(s.fontSize)||0)}}).filter(x=>x.display!=='none'&&(x.left<-3||x.right>innerWidth+3||x.width>innerWidth+3)).slice(0,100);const tiny=els.filter(el=>{const r=el.getBoundingClientRect();const s=getComputedStyle(el);return r.width>0&&r.height>0&&parseFloat(s.fontSize)<10}).slice(0,30).map(el=>({tag:el.tagName,cls:typeof el.className==='string'?el.className.slice(0,90):'',text:(el.textContent||'').trim().slice(0,80),font:getComputedStyle(el).fontSize}));return {iw:innerWidth,ih:innerHeight,sw:Math.max(de.scrollWidth,body?.scrollWidth||0),sh:Math.max(de.scrollHeight,body?.scrollHeight||0),title:document.title,text:(body?.innerText||'').slice(0,1400),bad,tiny,sticky:[...document.querySelectorAll('.sticky-contact')].map(el=>{const r=el.getBoundingClientRect();return {display:getComputedStyle(el).display,opacity:getComputedStyle(el).opacity,left:r.left,right:r.right,top:r.top,bottom:r.bottom}}),nav:[...document.querySelectorAll('.topbar nav,.mobile-nav')].map(el=>({cls:el.className,display:getComputedStyle(el).display}))};});
            await p.screenshot({path:`audit/${name}.png`,fullPage:true}); out.push({name,status,err,m,consoleErrors:ce,pageErrors:pe,failedRequests:rf.slice(0,50)}); console.log('RESULT',JSON.stringify(out.at(-1))); await c.close();await b.close();
          }
          fs.writeFileSync('audit/report.json',JSON.stringify(out,null,2));
          JS
          node audit/run.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hf-mobile-audit-fast
          path: audit
          retention-days: 1
